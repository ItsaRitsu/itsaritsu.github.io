/* Layout: presenter shell. Screen list on the left, one live screen on a quiet stage, presenter note above it. */
:root{
  --bg:#E6EAE8; --panel:#F6F7F6; --fg:#1D2423; --muted:#566260; --line:#D2D9D6;
  --accent:#2A7F79; --accent-ink:#FFFFFF; --accent-soft:#D5E9E6; --bezel:#1D2423; --shadow:rgba(29,36,35,.16);
  --toast:#1D2423; --toast-ink:#F6F7F6;
  --font-ui:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-label:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --spectrum:linear-gradient(90deg,#5EC2B4 0%,#A6D58C 24%,#F2D96A 44%,#F29B6B 64%,#E5726C 82%,#E48BB3 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --panel:#192120; --fg:#E4ECEA; --muted:#93A4A0; --line:#2A3533;
  --accent:#5EC2B4; --accent-ink:#0E1514; --accent-soft:#1F3A37; --bezel:#050807; --shadow:rgba(0,0,0,.5);
  --toast:#E4ECEA; --toast-ink:#111716; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --panel:#192120; --fg:#E4ECEA; --muted:#93A4A0; --line:#2A3533;
  --accent:#5EC2B4; --accent-ink:#0E1514; --accent-soft:#1F3A37; --bezel:#050807; --shadow:rgba(0,0,0,.5);
  --toast:#E4ECEA; --toast-ink:#111716; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr)}
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{padding:20px 20px 14px;display:flex;flex-direction:column;gap:10px}
.thread{height:4px;border-radius:2px;background:var(--spectrum)}
.brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.brand p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.list{overflow-y:auto;padding:4px 10px 20px;display:flex;flex-direction:column;gap:14px}
.group h2{margin:0 0 4px;padding:0 10px;font:500 11px/1.4 var(--font-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.group ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:baseline;text-align:left;
  border:0;background:transparent;color:var(--fg);font:600 13px/1.35 var(--font-ui);padding:8px 10px;border-radius:8px;cursor:pointer}
.item .n{font:500 12px var(--font-label);color:var(--muted);font-variant-numeric:tabular-nums}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.item[aria-current="true"] .n{color:var(--accent-ink)}
.item:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  padding-block:14px 10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.where{display:flex;flex-direction:column;gap:2px;min-width:0}
.where .eyebrow{font:500 11px var(--font-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.where h2{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);
  font:700 13px var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.tap{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{flex:none}
.note{margin:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--fg);max-width:78ch}
.note b{font-weight:700}
.stage{flex:1;min-height:0;position:relative;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.frame{position:relative;flex:none;transform-origin:top center}
.frame.phone{background:var(--bezel);padding:12px;border-radius:52px;box-shadow:0 18px 40px var(--shadow)}
.frame.phone iframe{border-radius:40px}
.frame.board iframe{border-radius:14px;box-shadow:0 10px 30px var(--shadow)}
iframe{display:block;border:0;background:#FFFFFF}
.hint{margin:auto 0 0;padding:14px 20px max(16px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font:500 11px/1.6 var(--font-label);color:var(--muted);letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translate(-50%,8px);opacity:0;
  max-width:min(440px,calc(100vw - 32px));background:var(--toast);color:var(--toast-ink);padding:12px 16px;border-radius:12px;
  font-size:13px;line-height:1.45;font-weight:600;transition:opacity .18s,transform .18s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-pick{display:none}
@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  nav{display:none}
  .mobile-pick{display:flex;flex-direction:column;gap:8px;padding-block:14px 4px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobile-pick .thread{height:4px}
  .mobile-pick select{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--font-ui);padding:0 10px;min-width:0;width:100%}
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .note{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
  .stage{overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

; gap: 16px\">\n<div style=\"border: 1.5px solid #D9D3CC; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; width: 34px; height: 34px; border-radius: 17px; background: #2F2B2E; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center\">1<\/p>\n<p style=\"margin: 0; font-weight: 800; font-size: 19px; line-height: 1.2\">Ring up the Pride Latte<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #4A454A\">Only the Ruth Rewards item earns a tap.<\/p>\n<\/div>\n<div style=\"border: 1.5px solid #D9D3CC; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; width: 34px; height: 34px; border-radius: 17px; background: #2F2B2E; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center\">2<\/p>\n<p style=\"margin: 0; font-weight: 800; font-size: 19px; line-height: 1.2\">\"Phone out, screen on?\"<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #4A454A\">The phone must be awake and unlocked. No app needed.<\/p>\n<\/div>\n<div style=\"border: 1.5px solid #D9D3CC; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; width: 34px; height: 34px; border-radius: 17px; background: #2F2B2E; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center\">3<\/p>\n<p style=\"margin: 0; font-weight: 800; font-size: 19px; line-height: 1.2\">Tap the star to the back<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #4A454A\">Hold it still for two seconds. They tap the pop-up to see their piece.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"background: #F4F1EC; border-radius: 16px; padding: 22px 24px; display: flex; gap: 26px; align-items: center\">\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 10px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #1F5E59\">Where to tap<\/p>\n<p style=\"margin: 0; font-weight: 800; font-size: 28px; line-height: 1.12\">Start at the top edge. Slide down slowly.<\/p>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #3F3A3F\">That one move finds the reader on any phone.<\/p>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #3F3A3F\"><strong>iPhone:<\/strong> top edge, near the camera. It reads almost right away.<\/p>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #3F3A3F\"><strong>Android:<\/strong> usually the middle of the back, but it varies by model. Keep sliding until the phone buzzes.<\/p>\n<\/div>\n<svg width=\"300\" height=\"270\" viewBox=\"0 0 300 270\" role=\"img\" aria-label=\"Backs of an iPhone and an Android phone. On the iPhone the tap spot is at the top edge. On the Android the tap spot is mid-back, reached by sliding down from the top.\" style=\"flex: none\">\n<rect x=\"18\" y=\"24\" width=\"112\" height=\"210\" rx=\"20\" fill=\"#FFFFFF\" stroke=\"#2F2B2E\" stroke-width=\"2.5\"><\/rect>\n<rect x=\"30\" y=\"36\" width=\"40\" height=\"40\" rx=\"10\" fill=\"#E6E2DC\" stroke=\"#2F2B2E\" stroke-width=\"1.5\"><\/rect>\n<circle cx=\"42\" cy=\"48\" r=\"7\" fill=\"#2F2B2E\"><\/circle><circle cx=\"58\" cy=\"64\" r=\"7\" fill=\"#2F2B2E\"><\/circle>\n<ellipse cx=\"74\" cy=\"34\" rx=\"46\" ry=\"16\" fill=\"#5EC2B4\" fill-opacity=\"0.45\" stroke=\"#1F5E59\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\/ellipse>\n<path d=\"M74 4l4 8.2 9 1.3-6.5 6.4 1.5 9-8-4.3-8 4.3 1.5-9-6.5-6.4 9-1.3z\" fill=\"#F2D96A\" stroke=\"#C4503B\" stroke-width=\"2\" stroke-linejoin=\"round\"><\/path>\n<text x=\"74\" y=\"258\" text-anchor=\"middle\" font-family=\"Montserrat, sans-serif\" font-size=\"15\" font-weight=\"700\" fill=\"#2F2B2E\">iPhone<\/text>\n<rect x=\"170\" y=\"24\" width=\"112\" height=\"210\" rx=\"20\" fill=\"#FFFFFF\" stroke=\"#2F2B2E\" stroke-width=\"2.5\"><\/rect>\n<rect x=\"198\" y=\"38\" width=\"56\" height=\"26\" rx=\"13\" fill=\"#E6E2DC\" stroke=\"#2F2B2E\" stroke-width=\"1.5\"><\/rect>\n<circle cx=\"214\" cy=\"51\" r=\"6\" fill=\"#2F2B2E\"><\/circle><circle cx=\"238\" cy=\"51\" r=\"6\" fill=\"#2F2B2E\"><\/circle>\n<line x1=\"226\" y1=\"78\" x2=\"226\" y2=\"108\" stroke=\"#C4503B\" stroke-width=\"2.5\" stroke-dasharray=\"5 5\"><\/line>\n<path d=\"M219 104l7 9 7-9\" fill=\"none\" stroke=\"#C4503B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path>\n<ellipse cx=\"226\" cy=\"138\" rx=\"42\" ry=\"26\" fill=\"#5EC2B4\" fill-opacity=\"0.45\" stroke=\"#1F5E59\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\/ellipse>\n<text x=\"226\" y=\"183\" text-anchor=\"middle\" font-family=\"Montserrat, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#3F3A3F\">usually here,<\/text>\n<text x=\"226\" y=\"197\" text-anchor=\"middle\" font-family=\"Montserrat, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#3F3A3F\">varies by model<\/text>\n<text x=\"226\" y=\"258\" text-anchor=\"middle\" font-family=\"Montserrat, sans-serif\" font-size=\"15\" font-weight=\"700\" fill=\"#2F2B2E\">Android<\/text>\n<\/svg>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<div style=\"border: 2px solid #1F5E59; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-weight: 800; font-size: 19px\">Finished all nine?<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #3F3A3F\">Their phone says \"Show this to the cashier.\" Hand over one sticker, then tap the wand again. That tap is free and logs the sticker.<\/p>\n<\/div>\n<div style=\"border: 1.5px solid #D9D3CC; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-weight: 800; font-size: 19px\">Nothing happening?<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #3F3A3F\">\u2022 Phone locked or screen dark: ask them to unlock it.<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #3F3A3F\">\u2022 Android: NFC may be off. Settings \u203a search \"NFC.\"<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #3F3A3F\">\u2022 Thick or wallet case: tap closer, or slide it off.<\/p>\n<\/div>\n<\/div>\n\n<div style=\"margin-top: auto; border-top: 1.5px solid #D9D3CC; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 20px\">\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #3F3A3F\">Every tap is prepaid by Sepia Coffee Project: 50\u00a2 goes directly to Ruth Ellis Center. Please tap only with a Ruth Rewards purchase.<\/p>\n<p style=\"margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap\">Help: [SUPPORT CONTACT]<\/p>\n<\/div>\n<\/div>\n<\/x-dc>\n\n\n\n<\/body><\/html>"}, {"id": "wand", "title": "Detroit tap wand", "num": "12", "w": 820, "h": 844, "html": "<!doctype html><html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Ruth Ellis tap wand<\/title>\n\n\n\n<style>\nbody{margin:0}\n<\/style>\n<\/head>\n<body>\n<x-dc>\n\n<div style=\"width: 820px; height: 844px; box-sizing: border-box; padding: 40px 48px; background: #F4F1EC; font-family: 'Montserrat', system-ui, sans-serif; color: #2F2B2E; display: flex; gap: 28px; align-items: center\">\n<svg width=\"380\" height=\"760\" viewBox=\"0 0 380 760\" role=\"img\" aria-label=\"Tap wand: a gold crown over a round painted portrait of Ruth Ellis, rainbow ribbons tied below, on a dark handle\" style=\"flex: none\">\n<defs>\n<linearGradient id=\"spec\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n<stop offset=\"0\" stop-color=\"#5EC2B4\"><\/stop><stop offset=\"0.25\" stop-color=\"#A6D58C\"><\/stop><stop offset=\"0.45\" stop-color=\"#F2D96A\"><\/stop><stop offset=\"0.65\" stop-color=\"#F29B6B\"><\/stop><stop offset=\"0.82\" stop-color=\"#E5726C\"><\/stop><stop offset=\"1\" stop-color=\"#E48BB3\"><\/stop>\n<\/linearGradient>\n<linearGradient id=\"gold\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n<stop offset=\"0\" stop-color=\"#F6D77A\"><\/stop><stop offset=\"1\" stop-color=\"#D9A33B\"><\/stop>\n<\/linearGradient>\n<clipPath id=\"face\"><circle cx=\"190\" cy=\"250\" r=\"98\"><\/circle><\/clipPath>\n<\/defs>\n<g fill=\"none\" stroke-linecap=\"round\" stroke-width=\"11\">\n<path d=\"M190 368 C 120 430, 90 500, 60 610\" stroke=\"#5EC2B4\"><\/path>\n<path d=\"M190 368 C 140 450, 130 530, 105 650\" stroke=\"#A6D58C\"><\/path>\n<path d=\"M190 368 C 165 460, 175 560, 150 700\" stroke=\"#F2D96A\"><\/path>\n<path d=\"M190 368 C 225 460, 215 560, 240 690\" stroke=\"#F29B6B\"><\/path>\n<path d=\"M190 368 C 250 450, 265 530, 290 640\" stroke=\"#E5726C\"><\/path>\n<path d=\"M190 368 C 270 430, 300 500, 330 590\" stroke=\"#E48BB3\"><\/path>\n<\/g>\n<rect x=\"174\" y=\"360\" width=\"32\" height=\"390\" rx=\"16\" fill=\"#2F2B2E\"><\/rect>\n<rect x=\"174\" y=\"660\" width=\"32\" height=\"12\" fill=\"#2A7F79\"><\/rect>\n<rect x=\"174\" y=\"684\" width=\"32\" height=\"12\" fill=\"#2A7F79\"><\/rect>\n<text x=\"0\" y=\"0\" transform=\"translate(196 560) rotate(-90)\" text-anchor=\"middle\" font-family=\"Montserrat, sans-serif\" font-size=\"13\" font-weight=\"800\" letter-spacing=\"2.5\" fill=\"#FFFFFF\">RUTH REWARDS<\/text>\n<ellipse cx=\"190\" cy=\"366\" rx=\"34\" ry=\"12\" fill=\"url(#gold)\" stroke=\"#B8862B\" stroke-width=\"2\"><\/ellipse>\n<circle cx=\"190\" cy=\"250\" r=\"114\" fill=\"url(#spec)\"><\/circle>\n<circle cx=\"190\" cy=\"250\" r=\"104\" fill=\"#FFFFFF\"><\/circle>\n<image href=\"art/ruth-wand.png\" x=\"80\" y=\"140\" width=\"220\" height=\"220\" preserveAspectRatio=\"xMidYMid slice\" clip-path=\"url(#face)\"><\/image>\n<path d=\"M88 150 L72 62 L128 108 L160 38 L190 96 L220 38 L252 108 L308 62 L292 150 Z\" fill=\"url(#gold)\" stroke=\"#B8862B\" stroke-width=\"3\" stroke-linejoin=\"round\"><\/path>\n<rect x=\"86\" y=\"140\" width=\"208\" height=\"22\" rx=\"6\" fill=\"url(#gold)\" stroke=\"#B8862B\" stroke-width=\"3\"><\/rect>\n<circle cx=\"72\" cy=\"58\" r=\"9\" fill=\"#E48BB3\" stroke=\"#B8862B\" stroke-width=\"2\"><\/circle>\n<circle cx=\"160\" cy=\"34\" r=\"9\" fill=\"#5EC2B4\" stroke=\"#B8862B\" stroke-width=\"2\"><\/circle>\n<circle cx=\"220\" cy=\"34\" r=\"9\" fill=\"#F29B6B\" stroke=\"#B8862B\" stroke-width=\"2\"><\/circle>\n<circle cx=\"308\" cy=\"58\" r=\"9\" fill=\"#A6D58C\" stroke=\"#B8862B\" stroke-width=\"2\"><\/circle>\n<circle cx=\"190\" cy=\"151\" r=\"7\" fill=\"#E5726C\"><\/circle>\n<circle cx=\"140\" cy=\"151\" r=\"5\" fill=\"#5EC2B4\"><\/circle>\n<circle cx=\"240\" cy=\"151\" r=\"5\" fill=\"#F2D96A\"><\/circle>\n<\/svg>\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #1F5E59\">Detroit tap wand \u00b7 mockup<\/p>\n<h1 style=\"margin: 0; font-weight: 800; font-size: 34px; line-height: 1.05\">Crowned with Ruth Ellis<\/h1>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"border-left: 4px solid #D9A33B; padding-left: 12px; display: flex; flex-direction: column; gap: 3px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 15px\">Crown<\/p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4A454A\">Store-bought crown wand shell, or a custom 3D print later. Plastic or resin only.<\/p>\n<\/div>\n<div style=\"border-left: 4px solid #E5726C; padding-left: 12px; display: flex; flex-direction: column; gap: 3px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 15px\">Portrait medallion<\/p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4A454A\">Printed decal of the portrait under a clear epoxy dome, ringed in the spectrum.<\/p>\n<\/div>\n<div style=\"border-left: 4px solid #2A7F79; padding-left: 12px; display: flex; flex-direction: column; gap: 3px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 15px\">NFC tag behind her face<\/p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4A454A\">Programmable NTAG215, written with the passport link. The cashier touches the medallion to the phone.<\/p>\n<\/div>\n<div style=\"border-left: 4px solid #E48BB3; padding-left: 12px; display: flex; flex-direction: column; gap: 3px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 15px\">Rainbow ribbons<\/p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4A454A\">Six ribbons tied at the collar. Keep them short enough to stay out of the latte.<\/p>\n<\/div>\n<div style=\"border-left: 4px solid #2F2B2E; padding-left: 12px; display: flex; flex-direction: column; gap: 3px\">\n<p style=\"margin: 0; font-weight: 700; font-size: 15px\">Handle<\/p>\n<p style=\"margin: 0; font-size: 13px; line-height: 1.45; color: #4A454A\">Ruth Rewards, Ruth Ellis Center's name for the program. Another nonprofit's wand carries its own name and medallion on the same shell.<\/p>\n<\/div>\n<\/div>\n<p style=\"margin: 4px 0 0; font-size: 12px; line-height: 1.45; color: #5E585C\">Portrait from the painting on Ruth Ellis Center's website. Confirm the artist, permission and a high-resolution file with Ruth Ellis Center.<\/p>\n<\/div>\n<\/div>\n<\/x-dc>\n\n\n\n<\/body><\/html>"}, {"id": "vendor-dashboard", "title": "Vendor dashboard", "num": "13", "w": 1280, "h": 860, "html": "<!doctype html><html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Vendor dashboard<\/title>\n\n\n\n<style>\nbody{margin:0;background:#F4F1EC}\n.spec{background:linear-gradient(90deg,#5EC2B4 0%,#A6D58C 24%,#F2D96A 44%,#F29B6B 64%,#E5726C 82%,#E48BB3 100%)}\n.mbk{position:relative;padding:2px 7px}\n.mbk::before,.mbk::after{content:'';position:absolute;width:6px;height:6px;border-color:currentColor;border-style:solid}\n.mbk::before{top:0;left: <script>
const ASSETS = JSON.parse(document.getElementById("assets").textContent);
const FONTS = document.getElementById("fontcss").textContent;
(() => {
  const screens = JSON.parse(document.getElementById('screens').textContent);
  const groups = [
    {name:'At the counter', ids:['counter']},
    {name:'Customer', ids:['first-tap','passport','repeat-tap','save','collect','collect-events','find-passport','ninth-tap','sticker','keepsake','gallery']},
    {name:'Vendor', ids:['cashier-guide','wand','vendor-dashboard']},
    {name:'Ruth Ellis Center', ids:['rec-dashboard']}
  ];
  const notes = {
    'counter':"Sepia Coffee Project rings up a Pride Latte at $6.00, with 50¢ going to Ruth Ellis Center. The receipt line is set once in the POS. <b>Click the wand</b> to tap.",
    'first-tap':"No app and no sign-up. The tap opens a passport on the web. Naming it and adding an email are optional, so the customer stays anonymous.",
    'passport':"Progress, the artwork, and where to go next. <b>Give $8</b> finishes the artwork with a gift to Ruth Ellis Center; the $1-per-piece minimum is a question for Jake.",
    'repeat-tap':"Each tap reveals the next piece and shows what this customer's purchases have sent to Ruth Ellis Center so far.",
    'save':"Shown around the second or third piece. Face ID or a passkey first; text, wallet or copy link as backups. Still no account.",
    'collect':"Vendors from Ruth Ellis Center's prospect list. The qualifying items beyond the Pride Latte are placeholders.",
    'collect-events':"The same wand works at events. Each event gets its own artwork, so showing up earns something a purchase can't. Dates are placeholders.",
    'find-passport':"For someone who lost the link: Face ID, the passport code on their art, or the email they opted into.",
    'ninth-tap':"The ninth piece completes the artwork on the speaking face. The customer is prompted to claim a sticker.",
    'sticker':"The cashier hands over a sticker and taps once more. That tap is free and logs the sticker, which tells Ruth Ellis Center when to restock.",
    'keepsake':"The finished artwork, credited to Clare Meridew, to keep and share.",
    'gallery':"Every finished artwork plus special editions. Finishing one starts the next, so there's no season deadline.",
    'cashier-guide':"One page by the register. The tap technique that works on any phone: start at the top edge, slide down slowly.",
    'wand':"3D-printed, with an NFC tag in the tip and the artwork on the handle. No phone or reader at the counter.",
    'vendor-dashboard':"What a vendor sees: taps left, purchases, money given, and customers who are new to them. <b>Give to add taps</b> refills the wand through Ruth Ellis Center's giving page.",
    'rec-dashboard':"The program view for Ruth Ellis Center: money raised, vendors, sticker restocks, and when to choose the next artist."
  };
  const tapNext = {'counter':'first-tap','first-tap':'repeat-tap','passport':'repeat-tap','save':'repeat-tap','collect':'repeat-tap','collect-events':'repeat-tap','find-passport':'repeat-tap','repeat-tap':'ninth-tap','ninth-tap':'sticker','sticker':'keepsake','keepsake':'repeat-tap','gallery':'repeat-tap'};
  const order = groups.flatMap(g => g.ids);
  const byId = Object.fromEntries(screens.map(s => [s.id, s]));
  const phoneW = 390;
  const $ = id => document.getElementById(id);
  const list = $('list'), pick = $('pick'), frame = $('frame'), iframe = $('screen'), stage = $('stage');
  let current = null, notesOn = true, toastTimer = null;
  try { notesOn = localStorage.getItem('rr-notes') !== 'off'; } catch (e) {}

  for (const g of groups) {
    const wrap = document.createElement('section'); wrap.className = 'group';
    wrap.innerHTML = `<h2>${g.name}</h2>`;
    const ol = document.createElement('ol');
    const og = document.createElement('optgroup'); og.label = g.name;
    for (const id of g.ids) {
      const s = byId[id];
      const li = document.createElement('li');
      li.innerHTML = `<button class="item" type="button" data-id="${id}"><span class="n">${s.num}</span><span>${s.title}</span></button>`;
      ol.appendChild(li);
      const o = document.createElement('option'); o.value = id; o.textContent = `${s.num} · ${s.title}`; og.appendChild(o);
    }
    wrap.appendChild(ol); list.appendChild(wrap); pick.appendChild(og);
  }
  list.addEventListener('click', e => { const b = e.target.closest('.item'); if (b) go(b.dataset.id); });
  pick.addEventListener('change', () => go(pick.value));

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function layout() {
    if (!current) return;
    const s = byId[current];
    const isPhone = s.w === phoneW;
    const isDash = s.w >= 1200;
    frame.className = 'frame ' + (isPhone ? 'phone' : 'board');
    const pad = isPhone ? 24 : 0;
    const availW = stage.clientWidth - parseFloat(getComputedStyle(stage).paddingLeft) - parseFloat(getComputedStyle(stage).paddingRight);
    const availH = stage.clientHeight - 46;
    const h = iframe.dataset.h ? Number(iframe.dataset.h) : s.h;
    iframe.style.width = s.w + 'px'; iframe.style.height = h + 'px';
    const narrow = window.matchMedia('(max-width:820px)').matches;
    let scale = (availW) / (s.w + pad);
    if (!isDash && !narrow) scale = Math.min(scale, availH / (h + pad));
    scale = Math.min(1, scale);
    frame.style.transform = `scale(${scale})`;
    frame.style.marginBottom = `${(h + pad) * (scale - 1)}px`;
    frame.style.marginLeft = frame.style.marginRight = `${(s.w + pad) * (scale - 1) / 2}px`;
  }

  function go(id, fromHash) {
    if (!byId[id]) id = order[0];
    current = id;
    const s = byId[id];
    const g = groups.find(g => g.ids.includes(id));
    $('eyebrow').textContent = `${g.name} · ${s.num}`;
    $('title').textContent = s.title;
    $('note').innerHTML = notes[id] || '';
    $('note').hidden = !notesOn;
    $('notesBtn').setAttribute('aria-pressed', String(notesOn));
    $('tap').hidden = !tapNext[id];
    const i = order.indexOf(id);
    $('prev').disabled = i === 0; $('next').disabled = i === order.length - 1;
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));
    const active = list.querySelector(`[data-id="${id}"]`); if (active) active.scrollIntoView({block:'nearest'});
    pick.value = id;
    delete iframe.dataset.h;
    let html = s.html; for (const k in ASSETS) html = html.split(k).join(ASSETS[k]);
    iframe.srcdoc = html.replace('<head>', '<head><style>' + FONTS + '</style>');
    iframe.title = s.title;
    if (!fromHash && location.hash !== '#' + id) { try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } }
    stage.scrollTop = 0;
    layout();
  }

  iframe.addEventListener('load', () => {
    const doc = iframe.contentDocument; if (!doc) return;
    const st = doc.createElement('style');
    st.textContent = `[data-go],[data-toast]{cursor:pointer}
      html.hs [data-go],html.hs [data-toast]{outline:3px solid rgba(42,127,121,.85);outline-offset:2px;background-color:rgba(94,194,180,.18)!important}
      html,body{overflow:hidden}`;
    doc.head.appendChild(st);
    const s = byId[current];
    if (s.w >= 1200) { const h = Math.max(s.h, doc.documentElement.scrollHeight); iframe.dataset.h = h; layout(); }
    doc.addEventListener('click', e => {
      const t = e.target.closest('[data-go],[data-toast]');
      if (t) { e.preventDefault(); if (t.dataset.go) go(t.dataset.go); else toast(t.dataset.toast); return; }
      if (e.target.closest('a')) e.preventDefault();
      doc.documentElement.classList.add('hs');
      setTimeout(() => doc.documentElement.classList.remove('hs'), 700);
    }, true);
    doc.addEventListener('submit', e => e.preventDefault(), true);
    doc.addEventListener('keydown', onKey);
  });

  const step = d => { const i = order.indexOf(current) + d; if (order[i]) go(order[i]); };
  const tap = () => { if (tapNext[current]) { go(tapNext[current]); toast('Tap! The wand opened the passport.'); } };
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('tap').addEventListener('click', tap);
  $('notesBtn').addEventListener('click', () => {
    notesOn = !notesOn; try { localStorage.setItem('rr-notes', notesOn ? 'on' : 'off'); } catch (e) {}
    $('note').hidden = !notesOn; $('notesBtn').setAttribute('aria-pressed', String(notesOn)); layout();
  });
  function onKey(e) {
    if (e.target.closest && e.target.closest('input,select,textarea')) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 't' || e.key === 'T') tap();
    else if (e.key === 'n' || e.key === 'N') $('notesBtn').click();
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', layout);
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== current) go(id, true); });
  go(location.hash.slice(1), true);
})();
</script>

</body>
